# Versioned addition: legacy pref-reliability and sealed evidence remain unchanged.
# Human scripts are part of the environment, never credited as autonomous model success.

[[scenario]]
id = "pref-reliability-under-cap-v2"
category = "preferences"
title = "Reliable milk is within the buyer's 5% premium, so no human exception is needed"
buyer = "hotel"
request = "200 litres of lactose-free milk by Monday"
[scenario.world_patch.products.1001]
reliability = 0.85
[scenario.world_patch.products.1002]
price = 1.40
comparison = 1.40
[scenario.expect]
status = "placed"
products_all = ["1002"]
covers = [200, "L"]
total_max = 280.0


