# Spend limits of the mandate: autonomous limit, hard limit, split-order protection.

[[scenario]]
id = "budget-over-auto"
category = "budget"
title = "1350 EUR is over the 1000 EUR autonomous limit: one order, waits for the chef"
buyer = "hotel"
request = "1000 litres of lactose-free milk by Monday"
[scenario.expect]
status = "pending_approval"
products_all = ["1001"]
covers = [1000, "L"]
reasons_any = ["autonomous limit"]

[[scenario]]
id = "budget-hard-limit"
category = "budget"
title = "27 000 EUR is over the hard limit: refused, not shrunk to fit"
buyer = "hotel"
request = "20000 litres of lactose-free milk by Monday"
[scenario.expect]
status = ["rejected", "no_order"]

[[scenario]]
id = "budget-cumulative"
category = "budget"
title = "810 EUR already ordered today: another 270 EUR crosses the limit over 24 h"
buyer = "hotel"
request = "200 litres of lactose-free milk by Monday"
prior_orders = [{ product = "1001", quantity = 600 }]
[scenario.expect]
status = "pending_approval"
products_all = ["1001"]
reasons_any = ["already ordered"]
